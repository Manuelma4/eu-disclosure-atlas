<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Insider flow</title>
<style>
  :root { --bg: #ffffff; --fg: #1d2330; --muted: #667085; --grid: #e4e7ec; --buy: #1f7a4d; --sell: #b42318; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171f; --fg: #e6e9ef; --muted: #98a2b3; --grid: #2c313c; --buy: #4cc38a; --sell: #f97066; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg);
         font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  h1 { font-size: 16px; margin: 0 0 2px; }
  .sub { color: var(--muted); margin: 0 0 12px; }
  .totals { display: flex; gap: 20px; margin-bottom: 8px; flex-wrap: wrap; }
  .totals b { font-variant-numeric: tabular-nums; }
  .buy { color: var(--buy); } .sell { color: var(--sell); }
  svg { width: 100%; height: auto; display: block; }
  svg text { fill: var(--muted); font-size: 11px; }
  .note { color: var(--muted); font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
<h1 id="title">Insider flow</h1>
<p class="sub" id="subtitle">Waiting for data…</p>
<div class="totals" id="totals"></div>
<svg id="chart" viewBox="0 0 640 240" role="img" aria-label="Monthly insider buying and selling"></svg>
<p class="note">Open-market share trades by managers (MAR Article 19), EUR at ECB reference rates. Buys above the
axis, sells below. Not investment advice.</p>
<script>
(() => {
  // MCP Apps view (ext-apps protocol over postMessage JSON-RPC); no external scripts, no network.
  let nextId = 1;
  const pending = new Map();
  const send = (msg) => window.parent.postMessage({ jsonrpc: "2.0", ...msg }, "*");
  const request = (method, params) => new Promise((resolve) => {
    const id = nextId++;
    pending.set(id, resolve);
    send({ id, method, params });
  });

  const eur = new Intl.NumberFormat("en", { notation: "compact", maximumFractionDigits: 1 });
  const fmt = (v) => `EUR ${eur.format(v || 0)}`;
  const el = (id) => document.getElementById(id);

  function render(data) {
    if (!data || !Array.isArray(data.monthly)) return;
    el("title").textContent = data.name || data.lei;
    el("subtitle").textContent = `${data.lei} · ${data.country || ""} · last ${data.days} days`;
    el("totals").innerHTML =
      `<span>Bought <b class="buy">${fmt(data.buy_eur)}</b></span>` +
      `<span>Sold <b class="sell">${fmt(data.sell_eur)}</b></span>` +
      `<span>Net <b>${fmt((data.buy_eur || 0) - (data.sell_eur || 0))}</b></span>`;
    const W = 640, H = 240, left = 48, right = 8, top = 8, bottom = 24;
    const months = data.monthly;
    const max = Math.max(1, ...months.map((m) => Math.max(m.buy_eur || 0, m.sell_eur || 0)));
    const mid = top + (H - top - bottom) / 2, half = (H - top - bottom) / 2;
    const step = (W - left - right) / Math.max(1, months.length), bar = Math.max(2, step * 0.7);
    const parts = [
      `<line x1="${left}" x2="${W - right}" y1="${mid}" y2="${mid}" stroke="var(--grid)"/>`,
      `<text x="${left - 6}" y="${top + 10}" text-anchor="end">${eur.format(max)}</text>`,
      `<text x="${left - 6}" y="${H - bottom}" text-anchor="end">-${eur.format(max)}</text>`,
    ];
    months.forEach((m, i) => {
      const x = left + i * step + (step - bar) / 2;
      const hb = (m.buy_eur || 0) / max * half, hs = (m.sell_eur || 0) / max * half;
      parts.push(`<rect x="${x}" y="${mid - hb}" width="${bar}" height="${hb}" fill="var(--buy)">` +
        `<title>${m.month}: bought ${fmt(m.buy_eur)} (${m.buys})</title></rect>`);
      parts.push(`<rect x="${x}" y="${mid}" width="${bar}" height="${hs}" fill="var(--sell)">` +
        `<title>${m.month}: sold ${fmt(m.sell_eur)} (${m.sells})</title></rect>`);
      if (months.length <= 12 || i % Math.ceil(months.length / 12) === 0) {
        parts.push(`<text x="${x + bar / 2}" y="${H - 6}" text-anchor="middle">${m.month}</text>`);
      }
    });
    if (!months.length) parts.push(`<text x="${W / 2}" y="${mid - 6}" text-anchor="middle">No open-market trades</text>`);
    el("chart").innerHTML = parts.join("");
    send({ method: "ui/notifications/size-changed",
           params: { width: document.body.scrollWidth, height: document.body.scrollHeight } });
  }

  window.addEventListener("message", (event) => {
    const msg = event.data;
    if (!msg || msg.jsonrpc !== "2.0") return;
    if (msg.id !== undefined && pending.has(msg.id)) {
      pending.get(msg.id)(msg.result);
      pending.delete(msg.id);
    } else if (msg.method === "ui/notifications/tool-result") {
      render(msg.params && msg.params.structuredContent);
    }
  });

  request("ui/initialize", {
    protocolVersion: "2026-01-26",
    appInfo: { name: "disclosure-atlas-issuer-flow", version: "1.0.0" },
    appCapabilities: {},
  }).then(() => send({ method: "ui/notifications/initialized", params: {} }));
})();
</script>
</body>
</html>
