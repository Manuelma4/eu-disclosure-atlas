name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -e '.[dev,api]'
      - run: ruff check .
      - run: pytest -q
      - name: OpenAPI document is up to date
        run: disclosure-atlas --lake /tmp/empty-lake openapi > /tmp/openapi.json && diff -u web/openapi.json /tmp/openapi.json
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run i18n:check
      - run: npm run typecheck
      - run: npx eslint src
      - run: npm run build
  e2e:
    # Playwright and Lighthouse budgets against the fixture API (real FastAPI app over a synthetic lake).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      ATLAS_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -e '.[api]'
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - run: npm run lighthouse
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
            web/.lighthouseci
