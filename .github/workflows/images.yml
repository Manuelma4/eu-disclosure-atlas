name: Images
# Builds, scans (Trivy), describes (Syft SBOM) and signs (cosign keyless) every service image, then pushes it to
# GHCR as sha-<7 hex>. An image whose sources did not change is re-tagged from :main instead of rebuilt, so every
# commit has a full, signed set of images (pull-request previews rely on it). Kyverno admits only these signatures.
on:
  # Images are built for release tags and on demand (there is no running environment to feed on every
  # commit, and image builds are the most expensive jobs). Deploys promote a tag built here (deploy.yml).
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  # Never cancel a main build half-way: every main commit needs its full set of tags.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/manuelma4

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      web: ${{ steps.filter.outputs.web }}
      realtime-gateway: ${{ steps.filter.outputs.realtime-gateway }}
      alerts: ${{ steps.filter.outputs.alerts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            python: [Dockerfile, .dockerignore, pyproject.toml, uv.lock, README.md, "src/**", .github/workflows/images.yml]
            web: ["web/**", "!web/**/*.md", .github/workflows/images.yml]
            realtime-gateway: ["services/realtime-gateway/**", "contracts/**", .github/workflows/images.yml]
            alerts: ["services/alerts/**", "contracts/**", .github/workflows/images.yml]

  image:
    needs: changes
    # Fork pull requests get no registry or OIDC token.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing with the workflow's OIDC identity
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: python, context: ".", dockerfile: Dockerfile}
          - {name: web, context: web, dockerfile: web/Dockerfile}
          - {name: realtime-gateway, context: services/realtime-gateway, dockerfile: services/realtime-gateway/Dockerfile}
          - {name: alerts, context: services/alerts, dockerfile: services/alerts/Dockerfile}
    env:
      IMAGE: ghcr.io/manuelma4/atlas-${{ matrix.name }}
      CHANGED: ${{ needs.changes.outputs[matrix.name] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Plan
        id: plan
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ ! -f "${{ matrix.dockerfile }}" ]]; then
            echo "No ${{ matrix.dockerfile }} yet; nothing to build."; echo "mode=skip" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "tag=sha-${HEAD_SHA::7}" >> "$GITHUB_OUTPUT"
          if [[ "$CHANGED" == "true" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "mode=build" >> "$GITHUB_OUTPUT"
          else
            echo "mode=retag" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.plan.outputs.mode != 'skip'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.plan.outputs.mode != 'skip'

      - name: Re-tag the unchanged image from main
        id: retag
        if: steps.plan.outputs.mode == 'retag'
        run: |
          if docker buildx imagetools create -t "$IMAGE:${{ steps.plan.outputs.tag }}" "$IMAGE:main"; then
            echo "done=true" >> "$GITHUB_OUTPUT"
            echo "Re-tagged $IMAGE:main as ${{ steps.plan.outputs.tag }} (same digest, same signature)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No $IMAGE:main to re-tag; building instead."
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        id: build
        if: steps.plan.outputs.mode == 'build' || steps.retag.outputs.done == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # Kapsule nodes (PRO2) are amd64.
          platforms: linux/amd64
          push: true
          provenance: mode=max
          tags: |
            ${{ env.IMAGE }}:${{ steps.plan.outputs.tag }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:main', env.IMAGE) || '' }}
          # Browser-facing URLs of the website (repository variables; placeholders until the domain exists).
          build-args: |
            NEXT_PUBLIC_ATLAS_API_URL=${{ vars.ATLAS_PUBLIC_API_URL || 'https://api.atlas.example.org' }}
            NEXT_PUBLIC_ATLAS_STREAM_URL=${{ vars.ATLAS_PUBLIC_STREAM_URL || 'https://stream.atlas.example.org' }}
            NEXT_PUBLIC_ATLAS_ALERTS_URL=${{ vars.ATLAS_PUBLIC_ALERTS_URL || 'https://alerts.atlas.example.org' }}
            NEXT_PUBLIC_ATLAS_OIDC_ISSUER=${{ vars.ATLAS_OIDC_ISSUER || 'https://auth.atlas.example.org/realms/atlas' }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      - name: Trivy scan (fail on fixable critical vulnerabilities)
        if: steps.build.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          # Vulnerabilities only: the secret scanner flags example strings in third-party SDK docstrings, and
          # repository secrets are scanned by the security workflow.
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: table
          output: trivy.txt

      - name: Gate on critical vulnerabilities
        if: steps.build.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_SKIP_DB_UPDATE: "true"
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: SBOM (Syft, SPDX)
        if: steps.build.outcome == 'success'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom-${{ matrix.name }}.spdx.json

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.build.outcome == 'success'

      - name: Sign and attest (cosign keyless)
        if: steps.build.outcome == 'success'
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REF"
          {
            echo "### $IMAGE:${{ steps.plan.outputs.tag }}"
            echo "Digest \`${{ steps.build.outputs.digest }}\`, signed and attested (SPDX SBOM)."
            echo '```'; cat trivy.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
