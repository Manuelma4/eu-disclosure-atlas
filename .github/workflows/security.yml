# Security verification (P7, decision 0013): static analysis, dependency audits and a DAST baseline.
name: Security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"   # weekly, to catch advisories published after the last change
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect languages
    runs-on: ubuntu-latest
    outputs:
      codeql: ${{ steps.langs.outputs.codeql }}
      go_modules: ${{ steps.langs.outputs.go_modules }}
    steps:
      - uses: actions/checkout@v4
      - id: langs
        # Go services (P3) may not exist yet on every branch; CodeQL and govulncheck run when they do.
        run: |
          modules=$(find services -name go.mod -exec dirname {} \; 2>/dev/null | sort | jq -R . | jq -cs .)
          echo "go_modules=${modules:-[]}" >> "$GITHUB_OUTPUT"
          if [ "${modules:-[]}" = "[]" ]; then
            echo 'codeql=["python","javascript-typescript"]' >> "$GITHUB_OUTPUT"
          else
            echo 'codeql=["python","javascript-typescript","go"]' >> "$GITHUB_OUTPUT"
          fi

  codeql:
    name: CodeQL (${{ matrix.language }})
    needs: detect
    # Code scanning needs GitHub Advanced Security on private repositories; it runs once the repo is public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.detect.outputs.codeql) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: matrix.language == 'go'
        with:
          go-version: "1.27"
          check-latest: true
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'go' && 'autobuild' || 'none' }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip && pip install -e '.[api,otel]' pip-audit
      # Audits the resolved environment of every runtime extra the services ship with.
      - run: pip-audit --skip-editable --progress-spinner off

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # Production dependencies must be free of high and critical advisories; dev tooling is reported only.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=critical || true

  govulncheck:
    name: govulncheck (${{ matrix.module }})
    needs: detect
    if: needs.detect.outputs.go_modules != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.detect.outputs.go_modules) }}
    steps:
      - uses: actions/checkout@v4
      - uses: golang/govulncheck-action@v1
        with:
          go-version-input: "1.27"
          check-latest: true
          work-dir: ${{ matrix.module }}
          go-package: ./...

  zap-baseline:
    name: OWASP ZAP baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the API on a synthetic lake (Compose)
        run: |
          docker compose -f infra/compose.yaml -f deploy/observability/compose.yaml --profile app \
            up -d --wait --wait-timeout 300 query-api
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:8000/docs
          rules_file_name: .zap/rules.tsv
          cmd_options: -a -I
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-baseline-report
      - name: Compose logs
        if: failure()
        run: docker compose -f infra/compose.yaml -f deploy/observability/compose.yaml --profile app logs --tail 200
