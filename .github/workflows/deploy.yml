name: Deploy
# GitOps promotion: Argo CD deploys whatever main says, so a deploy is a pull request that sets the image tag
# in deploy/helm/atlas/values-prod.yaml, after checking that every image of that tag carries this repository's
# cosign signature. Run by hand with the tag to deploy (sha-<7 hex> from the Images workflow); an earlier tag
# rolls back.
on:
  # Manual by design: the owner promotes a signed tag when they decide to (no automatic pull requests).
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy, e.g. sha-1a2b3c4 (an earlier tag rolls back)"
        required: true
      environment:
        description: "Environment values file to update"
        type: choice
        options: [prod]
        default: prod

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'prod' }}
    env:
      ENVIRONMENT: ${{ inputs.environment || 'prod' }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalise the tag
        run: |
          # A full commit sha is accepted too; images are tagged with its first 7 characters.
          if [[ "$TAG" =~ ^sha-[0-9a-f]{8,}$ ]]; then TAG="${TAG:0:11}"; fi
          [[ "$TAG" =~ ^sha-[0-9a-f]{7}$ ]] || { echo "invalid tag: $TAG"; exit 1; }
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Verify the signatures of every image enabled in this environment
        run: |
          images=(atlas-python atlas-web)
          for svc in realtime-gateway alerts; do
            if [[ -f "services/$svc/Dockerfile" ]]; then images+=("atlas-$svc"); fi
          done
          for image in "${images[@]}"; do
            ref="ghcr.io/manuelma4/$image:$TAG"
            echo "verifying $ref"
            cosign verify "$ref" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp '^https://github\.com/Manuelma4/eu-disclosure-atlas/\.github/workflows/images\.yml@refs/heads/main$' \
              > /dev/null
          done

      - name: Open the promotion pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: Manuelma4
          GIT_AUTHOR_EMAIL: 71296266+Manuelma4@users.noreply.github.com
          GIT_COMMITTER_NAME: Manuelma4
          GIT_COMMITTER_EMAIL: 71296266+Manuelma4@users.noreply.github.com
        run: |
          file="deploy/helm/atlas/values-$ENVIRONMENT.yaml"
          current="$(sed -nE 's/^    tag: (sha-[0-9a-f]{7}).*/\1/p' "$file" | head -1)"
          if [[ "$current" == "$TAG" ]]; then echo "$ENVIRONMENT already runs $TAG"; exit 0; fi
          sed -i -E "0,/^    tag: sha-[0-9a-f]{7}/s//    tag: $TAG/" "$file"
          branch="deploy/$ENVIRONMENT-$TAG"
          git switch -c "$branch"
          git commit -am "Deploy $TAG to $ENVIRONMENT"
          git push -f origin "$branch"
          gh pr create --base main --head "$branch" --title "Deploy $TAG to $ENVIRONMENT" --body \
            "Promotes \`$TAG\` (was \`$current\`) in \`$file\`. Every image is signed by the images workflow on main
          (verified with cosign). Merging deploys it: Argo CD syncs \`$ENVIRONMENT-atlas\` from main.
          Roll back by reverting this pull request or by running this workflow with an earlier tag." \
            || echo "a pull request for $branch already exists"
