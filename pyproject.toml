[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "disclosure-atlas"
version = "0.1.0"
description = "Open, unified, research-grade data on insider trading and short selling across European markets"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Manuel David Maya Rosero" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "duckdb>=1.1",
    "pyarrow>=15",
    "pytz>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
events = ["confluent-kafka>=2.12"]
pdf = ["pdfplumber>=0.11"]
llm = ["anthropic>=0.40"]
research = ["pandas>=2.2", "numpy>=1.26", "statsmodels>=0.14", "yfinance>=0.2.40", "matplotlib>=3.8"]

[project.scripts]
disclosure-atlas = "disclosure_atlas.cli:main"

[project.urls]
Homepage = "https://github.com/Manuelma4/eu-disclosure-atlas"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-m 'not network'"
markers = ["network: hits live regulator endpoints (run with: pytest -m network)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
