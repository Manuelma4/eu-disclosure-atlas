# SOPS rules for bootstrap secrets (files named *.enc.yaml in this folder). Only the values of Kubernetes
# Secret data are encrypted, so diffs stay readable. Replace the placeholder with the owner's age public key
# (age-keygen -y ~/.config/sops/age/keys.txt) and add a second recipient for a recovery key.
creation_rules:
  - path_regex: .*\.enc\.yaml$
    encrypted_regex: ^(data|stringData)$
    age: age1placeholderreplacewiththeownerspublickeybeforeencryptinganything0000
