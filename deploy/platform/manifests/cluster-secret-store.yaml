# Scaleway Secret Manager as the source of runtime secrets. Its own API key is the one bootstrap secret,
# committed SOPS-encrypted (deploy/secrets/) and decrypted at sync time (docs/operations.md).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: scaleway
spec:
  provider:
    scaleway:
      region: fr-par
      projectId: "00000000-0000-0000-0000-000000000000"
      accessKey:
        secretRef:
          name: scaleway-secret-manager
          namespace: external-secrets
          key: access-key
      secretKey:
        secretRef:
          name: scaleway-secret-manager
          namespace: external-secrets
          key: secret-key
