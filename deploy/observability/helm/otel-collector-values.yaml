# Values for the upstream chart open-telemetry/opentelemetry-collector (contrib image), two tiers:
#   1. this release ("otel-gateway", Deployment) receives OTLP and load-balances spans by trace id;
#   2. a second release ("otel-collector", StatefulSet) runs ../otel-collector.yaml (tail sampling).
# Tail sampling needs every span of a trace on the same instance, hence the routing tier.
mode: deployment
replicaCount: 2
image:
  repository: otel/opentelemetry-collector-contrib
presets:
  kubernetesAttributes:
    enabled: true
config:
  receivers:
    otlp:
      protocols:
        grpc: { endpoint: "0.0.0.0:4317" }
        http: { endpoint: "0.0.0.0:4318" }
  exporters:
    loadbalancing:
      routing_key: traceID
      protocol:
        otlp:
          tls: { insecure: true }
      resolver:
        k8s:
          service: otel-collector-headless.observability
    otlp/metrics-logs:
      endpoint: otel-collector.observability.svc:4317
      tls: { insecure: true }
  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, batch]
        exporters: [loadbalancing]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, batch]
        exporters: [otlp/metrics-logs]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, batch]
        exporters: [otlp/metrics-logs]
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { memory: 512Mi }
