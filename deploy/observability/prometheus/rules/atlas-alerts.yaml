# Hand-written alerts that are not SLO burn rates. SLO alerts are generated by Sloth next to this file.
groups:
  - name: atlas-symptoms
    rules:
      - alert: AtlasSourceStale
        # A connector that has ingested nothing for 26 hours on a weekday is broken, even if the SLO, which
        # counts filings, has nothing to measure. Weekends are skipped (regulators publish on business days).
        expr: |
          (time() - max by (source) (atlas_source_last_ingested_seconds)) > 26 * 3600
          and on() (day_of_week() >= 2 and day_of_week() <= 5)
        for: 30m
        labels:
          severity: ticket
          owner: data
        annotations:
          summary: "No new filings from {{ $labels.source }} for more than a business day."
          runbook_url: "https://github.com/Manuelma4/eu-disclosure-atlas/blob/main/docs/runbooks/source-stale.md"
      - alert: AtlasQueryApiDown
        expr: absent_over_time(http_server_request_duration_seconds_count{job="query-api"}[10m]) and on() absent_over_time(atlas_source_last_ingested_seconds[10m])
        for: 5m
        labels:
          severity: page
          owner: platform
        annotations:
          summary: "No telemetry from the query API for 10 minutes: it is down or cannot export."
          runbook_url: "https://github.com/Manuelma4/eu-disclosure-atlas/blob/main/docs/runbooks/api-availability.md"
      - alert: AtlasTelemetryPipelineDown
        expr: up{job="otel-collector"} == 0
        for: 5m
        labels:
          severity: ticket
          owner: platform
        annotations:
          summary: "Prometheus cannot scrape the OpenTelemetry Collector; metrics and SLOs are blind."
          runbook_url: "https://github.com/Manuelma4/eu-disclosure-atlas/blob/main/docs/runbooks/telemetry-pipeline.md"
      - alert: AtlasKafkaConsumerLagHigh
        # Placeholder until P3 ships consumers: Redpanda (local) or kafka-exporter / Strimzi (cluster) lag.
        expr: |
          max by (group) (redpanda_kafka_consumer_group_lag_sum or sum by (group) (label_replace(kafka_consumergroup_lag, "group", "$1", "consumergroup", "(.*)"))) > 1000
        for: 10m
        labels:
          severity: ticket
          owner: platform
        annotations:
          summary: "Consumer group {{ $labels.group }} is more than 1,000 records behind."
          runbook_url: "https://github.com/Manuelma4/eu-disclosure-atlas/blob/main/docs/runbooks/kafka-consumer-lag.md"
