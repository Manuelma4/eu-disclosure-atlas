# Prometheus 3 for the local stack. Rules: SLOs generated by Sloth (slos/) plus hand-written alerts.
global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    environment: local

rule_files:
  - /etc/prometheus/rules/*.yaml

scrape_configs:
  # Application metrics arrive over OTLP at the Collector, which exposes them here (job = service.name).
  - job_name: otel-collector
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: otel-collector-self
    static_configs:
      - targets: ["otel-collector:8888"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  # Kafka API (Redpanda) metrics, including consumer-group lag, when infra/compose.yaml runs alongside.
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: ["kafka:9644"]
  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
