# Local cluster: one k3s server and one agent, Traefik on http://*.atlas.localhost:8080, the API server on 6550.
# Created by deploy/k3d/atlas.sh (make k3d-up). *.localhost resolves to 127.0.0.1 in browsers and curl.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: atlas
servers: 1
agents: 1
image: rancher/k3s:v1.36.5-k3s1
kubeAPI:
  host: 127.0.0.1
  hostIP: 127.0.0.1
  hostPort: "6550"
ports:
  - port: 127.0.0.1:8080:80
    nodeFilters: [loadbalancer]
  - port: 127.0.0.1:8443:443
    nodeFilters: [loadbalancer]
options:
  k3d:
    wait: true
    timeout: 180s
  k3s:
    extraArgs:
      # Lets containerised helm and kubectl on the k3d network reach the API through the load balancer.
      - arg: --tls-san=k3d-atlas-serverlb
        nodeFilters: [server:*]
  kubeconfig:
    updateDefaultKubeconfig: false
    switchCurrentContext: false
