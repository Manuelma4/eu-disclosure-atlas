# Kyverno policies for Atlas namespaces, after the operators and before any workload.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: preview-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: atlas-platform
  source:
    repoURL: https://github.com/Manuelma4/eu-disclosure-atlas.git
    targetRevision: main
    path: deploy/helm/atlas-policies
    helm:
      releaseName: atlas-policies
      valueFiles: [values.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [ServerSideApply=true]
