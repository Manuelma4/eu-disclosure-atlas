# realtime-gateway: Server-sent events from Kafka to browsers (Go).
enabled: false
component: api
replicaCount: 2
image:
  # registry and tag default to global.image.* (set per environment by the umbrella chart).
  registry: ""
  repository: atlas-realtime-gateway
  tag: ""
  # A digest pins the exact image Kyverno verifies (set by the promotion workflow in prod).
  digest: ""
  pullPolicy: ""
command: []
args: []
containerPort: 8080
service:
  port: 8080
env:
  KAFKA_BROKERS: '{{ include "atlas-lib.kafkaBootstrap" . }}'
envFromSecret: ""
kafka:
  bootstrapServers: ""
probes:
  liveness:
    httpGet: {path: /healthz, port: http}
    periodSeconds: 10
  readiness:
    httpGet: {path: /readyz, port: http}
    periodSeconds: 5
resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {cpu: "1", memory: 256Mi}
strategy: {}
terminationGracePeriodSeconds: 60
pdb:
  enabled: true
  minAvailable: 1
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
keda:
  enabled: false
  minReplicas: 0
  maxReplicas: 1
  topics: []
lake:
  enabled: false
  claimName: atlas-lake
  readOnly: true
networkPolicy:
  enabled: true
  ingressControllerNamespace: kube-system
  allowMonitoring: false
  monitoringNamespace: monitoring
  # OTLP traces and metrics to the OpenTelemetry Collector (deploy/observability, P7).
  egressOtlp: false
  otlpNamespace: observability
  ingressFrom: [web]
  allowIngressController: true
  egressTo: []
  egressKafka: true
  egressPostgres: false
  egressInternet: false
ingress:
  enabled: true
  host: "stream.{{ .Values.global.domain | default \"atlas.localhost\" }}"
  annotations: {}
global: {}

# Restricted Pod Security: the image's non-root user; the root filesystem is read-only.
securityContext:
  runAsUser: 65532
# Writable emptyDir mounts (the root filesystem is read-only).
writablePaths: ["/tmp"]
scratchSizeLimit: 256Mi
podLabels: {}
podAnnotations: {}
nodeSelector: {}
tolerations: []
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: realtime-gateway
