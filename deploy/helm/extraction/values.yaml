# extraction: AI-assisted extraction of PDF filings, consuming extraction requests from Kafka.
enabled: false
component: worker
replicaCount: 1
image:
  # registry and tag default to global.image.* (set per environment by the umbrella chart).
  registry: ""
  repository: atlas-python
  tag: ""
  # A digest pins the exact image Kyverno verifies (set by the promotion workflow in prod).
  digest: ""
  pullPolicy: ""
command: []
args: ["extract", "--consume", "atlas.extraction.requests.v1"]
containerPort: 0
service:
  port: 0
env:
  KAFKA_BOOTSTRAP_SERVERS: '{{ include "atlas-lib.kafkaBootstrap" . }}'
envFromSecret: "atlas-llm"
kafka:
  bootstrapServers: ""
# Enabled once the extraction worker lands (WS1); it is a Kafka consumer without an HTTP endpoint.
probes: {}
resources:
  requests: {cpu: 200m, memory: 512Mi}
  limits: {cpu: "2", memory: 2Gi}
strategy: {}
terminationGracePeriodSeconds: 30
pdb:
  enabled: false
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 80
keda:
  enabled: true
  minReplicas: 0
  maxReplicas: 4
  consumerGroup: extraction
  topics: [atlas.extraction.requests.v1]
  lagThreshold: 10
lake:
  enabled: false
  claimName: atlas-lake
  readOnly: true
networkPolicy:
  enabled: true
  ingressControllerNamespace: kube-system
  allowMonitoring: false
  monitoringNamespace: monitoring
  ingressFrom: []
  allowIngressController: false
  egressTo: []
  egressKafka: true
  egressPostgres: false
  # Claude API.
  egressInternet: true
ingress:
  enabled: false
  host: ""
  annotations: {}
global: {}

# Restricted Pod Security: the image's non-root user; the root filesystem is read-only.
securityContext:
  runAsUser: 10001
# Writable emptyDir mounts (the root filesystem is read-only).
writablePaths: ["/tmp"]
scratchSizeLimit: 256Mi
podLabels: {}
podAnnotations: {}
nodeSelector: {}
tolerations: []
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: extraction
