# alerts: Watchlists and alert delivery (email, Web Push, webhooks) from Kafka (Go).
enabled: false
component: worker
replicaCount: 1
image:
  # registry and tag default to global.image.* (set per environment by the umbrella chart).
  registry: ""
  repository: atlas-alerts
  tag: ""
  # A digest pins the exact image Kyverno verifies (set by the promotion workflow in prod).
  digest: ""
  pullPolicy: ""
command: []
args: []
containerPort: 8080
service:
  port: 8080
env:
  KAFKA_BROKERS: '{{ include "atlas-lib.kafkaBootstrap" . }}'
envFromSecret: "atlas-alerts"
kafka:
  bootstrapServers: ""
probes:
  liveness:
    httpGet: {path: /healthz, port: http}
    periodSeconds: 10
  readiness:
    httpGet: {path: /readyz, port: http}
    periodSeconds: 5
resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {cpu: "1", memory: 256Mi}
strategy: {}
terminationGracePeriodSeconds: 30
pdb:
  enabled: true
  maxUnavailable: 1
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 80
keda:
  enabled: true
  minReplicas: 1
  maxReplicas: 6
  consumerGroup: alerts
  topics: [atlas.filings.v1, atlas.signals.v1, atlas.notifications.v1]
  lagThreshold: 100
lake:
  enabled: false
  claimName: atlas-lake
  readOnly: true
networkPolicy:
  enabled: true
  ingressControllerNamespace: kube-system
  allowMonitoring: false
  monitoringNamespace: monitoring
  # OTLP traces and metrics to the OpenTelemetry Collector (deploy/observability, P7).
  egressOtlp: false
  otlpNamespace: observability
  ingressFrom: [web]
  allowIngressController: false
  egressTo: []
  egressKafka: true
  egressPostgres: true
  # Webhook endpoints, email and Web Push services.
  egressInternet: true
ingress:
  enabled: false
  host: ""
  annotations: {}
global: {}

# Restricted Pod Security: the image's non-root user; the root filesystem is read-only.
securityContext:
  runAsUser: 65532
# Writable emptyDir mounts (the root filesystem is read-only).
writablePaths: ["/tmp"]
scratchSizeLimit: 256Mi
podLabels: {}
podAnnotations: {}
nodeSelector: {}
tolerations: []
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: alerts
