# alerts: Watchlists and alert delivery (email, Web Push, webhooks) from Kafka (Go).
enabled: false
component: worker
replicaCount: 1
image:
  # registry and tag default to global.image.* (set per environment by the umbrella chart).
  registry: ""
  repository: atlas-alerts
  tag: ""
  # A digest pins the exact image Kyverno verifies (set by the promotion workflow in prod).
  digest: ""
  pullPolicy: ""
command: []
args: []
containerPort: 8080
service:
  port: 8080
env:
  KAFKA_BROKERS: '{{ include "atlas-lib.kafkaBootstrap" . }}'
  # The CloudNativePG cluster atlas-pg writes its application connection URI to this Secret.
  ATLAS_DATABASE_URL: {secretKeyRef: {name: atlas-pg-app, key: uri}}
  ATLAS_CORS_ORIGINS: '{{ .Values.global.webUrl | default "http://atlas.localhost:8080" }}'
  ATLAS_WEBSITE_URL: '{{ .Values.global.webUrl | default "http://atlas.localhost:8080" }}'
  ATLAS_OIDC_ISSUER: 'https://auth.{{ .Values.global.domain | default "atlas.localhost" }}/realms/atlas'
  ATLAS_OIDC_AUDIENCE: atlas-alerts
envFromSecret: "atlas-alerts"
kafka:
  bootstrapServers: ""
probes:
  liveness:
    httpGet: {path: /healthz, port: http}
    periodSeconds: 10
  readiness:
    httpGet: {path: /readyz, port: http}
    periodSeconds: 5
resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {cpu: "1", memory: 256Mi}
strategy: {}
terminationGracePeriodSeconds: 30
pdb:
  enabled: true
  maxUnavailable: 1
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 80
# One consumer group per role and delivery tier (services/alerts/README.md); KEDA scales on the largest lag.
keda:
  enabled: true
  minReplicas: 1
  maxReplicas: 6
  lagThreshold: 100
  topics: []
  triggers:
    - {topic: atlas.filings.v1, consumerGroup: atlas-alerts-evaluator, offsetResetPolicy: latest}
    - {topic: atlas.notifications.v1, consumerGroup: atlas-alerts-delivery}
    - {topic: atlas.notifications.v1.retry.5m, consumerGroup: atlas-alerts-delivery-retry-5m}
    - {topic: atlas.notifications.v1.retry.1h, consumerGroup: atlas-alerts-delivery-retry-1h}
lake:
  enabled: false
  claimName: atlas-lake
  readOnly: true
networkPolicy:
  enabled: true
  ingressControllerNamespace: kube-system
  allowMonitoring: false
  monitoringNamespace: monitoring
  # OTLP traces and metrics to the OpenTelemetry Collector (deploy/observability, P7).
  egressOtlp: false
  otlpNamespace: observability
  ingressFrom: [web]
  allowIngressController: true
  egressTo: []
  egressKafka: true
  egressPostgres: true
  # Webhook endpoints, email and Web Push services.
  egressInternet: true
# The browser calls the alerts API directly with a Keycloak access token.
ingress:
  enabled: true
  host: "alerts.{{ .Values.global.domain | default \"atlas.localhost\" }}"
  annotations: {}
global: {}

# Restricted Pod Security: the image's non-root user; the root filesystem is read-only.
securityContext:
  runAsUser: 65532
# Writable emptyDir mounts (the root filesystem is read-only).
writablePaths: ["/tmp"]
scratchSizeLimit: 256Mi
podLabels: {}
podAnnotations: {}
nodeSelector: {}
tolerations: []
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: alerts
