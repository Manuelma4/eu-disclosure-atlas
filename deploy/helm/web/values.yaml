# web: Website and backend-for-frontend (Next.js 16 standalone).
enabled: true
component: frontend
replicaCount: 2
image:
  # registry and tag default to global.image.* (set per environment by the umbrella chart).
  registry: ""
  repository: atlas-web
  tag: ""
  # A digest pins the exact image Kyverno verifies (set by the promotion workflow in prod).
  digest: ""
  pullPolicy: ""
command: []
args: []
containerPort: 3000
service:
  port: 3000
env:
  ATLAS_API_URL: 'http://query-api:8000'
envFromSecret: ""
kafka:
  bootstrapServers: ""
probes:
  startup:
    httpGet: {path: /, port: http}
    periodSeconds: 2
    failureThreshold: 30
  liveness:
    tcpSocket: {port: http}
    periodSeconds: 10
  readiness:
    httpGet: {path: /, port: http}
    periodSeconds: 10
    timeoutSeconds: 5
resources:
  requests: {cpu: 100m, memory: 192Mi}
  limits: {cpu: "1", memory: 512Mi}
strategy: {}
terminationGracePeriodSeconds: 30
pdb:
  enabled: true
  minAvailable: 1
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
keda:
  enabled: false
  minReplicas: 0
  maxReplicas: 1
  topics: []
lake:
  enabled: false
  claimName: atlas-lake
  readOnly: true
networkPolicy:
  enabled: true
  ingressControllerNamespace: kube-system
  allowMonitoring: false
  monitoringNamespace: monitoring
  # OTLP traces and metrics to the OpenTelemetry Collector (deploy/observability, P7).
  egressOtlp: false
  otlpNamespace: observability
  ingressFrom: []
  allowIngressController: true
  egressTo:
    - {name: query-api, port: 8000}
  egressKafka: false
  egressPostgres: false
  egressInternet: false
ingress:
  enabled: true
  host: "{{ .Values.global.domain | default \"atlas.localhost\" }}"
  annotations: {}
global: {}

# Restricted Pod Security: the image's non-root user; the root filesystem is read-only.
securityContext:
  runAsUser: 65532
# Writable emptyDir mounts (the root filesystem is read-only).
writablePaths: ["/tmp", "/app/.next/cache"]
scratchSizeLimit: 256Mi
podLabels: {}
podAnnotations: {}
nodeSelector: {}
tolerations: []
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: web
