{{- if .Values.networkPolicy.defaultDeny }}
# Default deny for every pod in the namespace; services open only what their own policy allows.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  labels:
    app.kubernetes.io/part-of: atlas
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
{{- end }}
