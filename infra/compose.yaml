# Local infrastructure for the next workstreams (P2: DuckLake + Dagster, P3: events and accounts).
# The current API and website only need the files in ./lake. Start with: docker compose -f infra/compose.yaml up -d
name: disclosure-atlas

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas-dev-only
      POSTGRES_DB: atlas
    ports: ["5432:5432"]
    volumes: [postgres:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      retries: 10

  nats:
    image: nats:2.14
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports: ["4222:4222", "8222:8222"]
    volumes: [nats:/data]

volumes:
  postgres:
  nats:
