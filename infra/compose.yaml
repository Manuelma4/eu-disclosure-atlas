# Local infrastructure for the next workstreams (P2: DuckLake + Dagster, P3: Kafka events, alerts, identity).
# PostgreSQL holds the DuckLake catalog (ATLAS_CATALOG, see docs/operations.md); without it the lake falls back to a
# local DuckDB-file catalog. Start with: docker compose -p atlas-<workstream> -f infra/compose.yaml up -d postgres
name: disclosure-atlas

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas-dev-only
      POSTGRES_DB: atlas
    # Host port configurable when a local PostgreSQL already uses 5432: ATLAS_PG_PORT=55432 docker compose ...
    ports: ["${ATLAS_PG_PORT:-5432}:5432"]
    volumes: [postgres:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      retries: 10

  kafka:
    # Redpanda speaks the Kafka API and bundles a schema registry; production runs Apache Kafka 4 (Strimzi).
    image: redpandadata/redpanda:latest
    command:
      - redpanda start --mode dev-container --smp 1 --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://kafka:9092,external://localhost:19092
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
    ports: ["19092:19092", "18081:18081"]
    volumes: [kafka:/var/lib/redpanda/data]

  kafka-console:
    image: redpandadata/console:latest
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://kafka:8081
    ports: ["8080:8080"]
    depends_on: [kafka]

volumes:
  postgres:
  kafka:
